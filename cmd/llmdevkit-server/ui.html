<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LLM DevKit</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#1e1e2e;--surface:#2a2a3c;--surface2:#33334a;--border:#444466;--text:#cdd6f4;--text2:#a6adc8;--accent:#89b4fa;--green:#a6e3a1;--red:#f38ba8;--yellow:#f9e2af;--mauve:#cba6f7;--peach:#fab387;--teal:#94e2d5}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden}
/* Top bar */
.topbar{display:flex;align-items:center;gap:12px;padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--border);min-height:44px;flex-shrink:0}
.topbar .brand{font-weight:700;color:var(--accent);font-size:14px}
.topbar .state{font-size:13px;color:var(--text2);flex:1}
.topbar .state .running{color:var(--green);font-weight:600}
.topbar .llm-name{font-size:13px;color:var(--mauve)}
.topbar button{background:var(--surface2);color:var(--text);border:1px solid var(--border);padding:4px 12px;border-radius:4px;cursor:pointer;font-size:12px}
.topbar button:hover{background:var(--border)}
.topbar button.danger{border-color:var(--red);color:var(--red)}
.topbar button.danger:hover{background:var(--red);color:var(--bg)}
.topbar .token-pill{display:inline-flex;align-items:center;gap:6px;background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:2px 10px;font-size:12px;color:var(--text2)}
.topbar .token-pill .tok-in{color:var(--peach)}
.topbar .token-pill .tok-out{color:var(--green)}
.topbar .autoscroll-label{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--text2);cursor:pointer;user-select:none}
.topbar .autoscroll-label input{accent-color:var(--accent)}
/* Layout */
.layout{display:flex;flex:1;overflow:hidden}
/* Sidebar */
.sidebar{width:260px;min-width:200px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
.sidebar-section{padding:12px;border-bottom:1px solid var(--border)}
.sidebar-section h3{font-size:11px;text-transform:uppercase;color:var(--text2);margin-bottom:8px;letter-spacing:0.5px}
.sidebar-section select,.sidebar-section input{width:100%;background:var(--surface2);color:var(--text);border:1px solid var(--border);padding:6px 8px;border-radius:4px;font-size:13px}
.sidebar-section select:focus,.sidebar-section input:focus{outline:none;border-color:var(--accent)}
.conv-list{flex:1;overflow-y:auto;padding:4px}
.conv-item{padding:8px 12px;border-radius:4px;cursor:pointer;font-size:13px;color:var(--text2);display:flex;justify-content:space-between;align-items:center}
.conv-item:hover{background:var(--surface2)}
.conv-item.active{background:var(--surface2);color:var(--accent)}
.conv-item .del{display:none;background:none;border:none;color:var(--red);cursor:pointer;font-size:16px;padding:0 4px}
.conv-item:hover .del{display:block}
.new-conv-btn{margin:8px 12px;padding:6px;background:var(--surface2);border:1px dashed var(--border);border-radius:4px;color:var(--text2);cursor:pointer;font-size:12px;text-align:center}
.new-conv-btn:hover{border-color:var(--accent);color:var(--accent)}
/* Main pane */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.messages{flex:1;overflow-y:auto;padding:16px 24px;display:flex;flex-direction:column;gap:12px}
/* Bubbles */
.bubble{max-width:85%;padding:10px 14px;border-radius:10px;font-size:14px;line-height:1.5;word-wrap:break-word;position:relative}
.bubble pre{background:var(--bg);padding:8px;border-radius:4px;overflow-x:auto;margin:6px 0;font-size:13px}
.bubble code{background:var(--bg);padding:1px 4px;border-radius:3px;font-size:13px}
.bubble pre code{background:none;padding:0}
.bubble p{margin:4px 0}
.bubble ul,.bubble ol{margin:4px 0 4px 20px}
.bubble h1,.bubble h2,.bubble h3,.bubble h4{margin:8px 0 4px}
.bubble table{border-collapse:collapse;margin:6px 0}
.bubble th,.bubble td{border:1px solid var(--border);padding:4px 8px;font-size:13px}
.bubble th{background:var(--surface2)}
/* Bubble types */
.bubble-system{background:var(--surface2);color:var(--text2);align-self:center;font-style:italic;font-size:13px;max-width:95%}
.bubble-tools{background:var(--surface2);color:var(--teal);align-self:center;max-width:95%;font-size:13px}
.bubble-tools .tool-box{display:inline-block;background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:4px 8px;margin:2px;font-size:12px}
.bubble-tools .tool-entry{background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:6px 10px;margin:4px 0}
.bubble-tools .tool-name{font-weight:600;color:var(--teal);font-family:monospace;font-size:12px}
.bubble-tools .tool-desc{color:var(--text2);font-size:12px;margin:2px 0}
.bubble-tools .tool-args{margin-top:3px}
.bubble-tools .tool-arg{display:inline-block;background:var(--surface);border:1px solid var(--border);border-radius:3px;padding:1px 5px;margin:1px;font-size:11px;font-family:monospace;color:var(--peach)}
.bubble-user{background:#3b3b5c;align-self:flex-end;border-bottom-right-radius:2px}
.bubble-llm{background:var(--surface2);align-self:flex-start;border-bottom-left-radius:2px}
.bubble-thinking{background:transparent;border:1px dashed var(--border);color:var(--text2);align-self:flex-start;font-style:italic;font-size:13px}
.bubble-tool-req{background:var(--surface2);border-left:3px solid var(--yellow);align-self:flex-start;font-size:13px;max-width:90%}
.bubble-tool-resp{background:var(--surface2);border-left:3px solid var(--green);align-self:flex-start;font-size:13px;max-width:90%}
.tool-args-table{border-collapse:collapse;margin:6px 0;width:100%}
.tool-args-table td{padding:2px 8px;font-size:12px;border-bottom:1px solid var(--border)}
.tool-args-table .arg-name{color:var(--peach);font-family:monospace;font-weight:600;white-space:nowrap;width:1%}
.tool-args-table .arg-val{color:var(--text);word-break:break-all}
.tool-meta{display:inline-block;background:var(--bg);border:1px solid var(--border);border-radius:3px;padding:0 5px;font-size:11px;color:var(--text2);margin-right:4px}
.bubble-error{background:#3b2030;border-left:3px solid var(--red);color:var(--red);align-self:center}
.bubble-label{font-size:11px;text-transform:uppercase;color:var(--text2);margin-bottom:4px;letter-spacing:0.5px}
.bubble-system .bubble-label{color:var(--mauve)}
.bubble-user .bubble-label{color:var(--accent)}
.bubble-llm .bubble-label{color:var(--green)}
.bubble-thinking .bubble-label{color:var(--text2)}
.bubble-tool-req .bubble-label{color:var(--yellow)}
.bubble-tool-resp .bubble-label{color:var(--teal)}
/* Collapsed bubbles */
.bubble.collapsed .bubble-content{display:none}
.bubble.collapsed .bubble-brief{display:block}
.bubble .bubble-brief{display:none;color:var(--text2);font-size:12px;font-style:normal;font-weight:400;text-transform:none;letter-spacing:0;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.bubble.collapsible .bubble-label{cursor:pointer}
.bubble{cursor:default}
/* Ask tool panels */
.ask-panel{background:var(--surface2);border:2px solid var(--accent);border-radius:8px;padding:14px;margin:8px 0;max-width:90%;align-self:center}
.ask-panel .ask-title{font-weight:700;color:var(--accent);margin-bottom:8px;font-size:14px}
.ask-panel textarea,.ask-panel input,.ask-panel select{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--border);padding:8px;border-radius:4px;font-size:13px;font-family:inherit;margin:4px 0}
.ask-panel textarea:focus,.ask-panel input:focus{outline:none;border-color:var(--accent)}
.ask-panel .btn-row{display:flex;gap:8px;margin-top:8px}
.ask-panel button{padding:6px 16px;border-radius:4px;border:1px solid var(--border);cursor:pointer;font-size:13px}
.ask-panel .btn-approve{background:var(--green);color:var(--bg);border-color:var(--green);font-weight:600}
.ask-panel .btn-deny{background:var(--surface2);color:var(--red);border-color:var(--red)}
.ask-panel .deny-reason{margin-top:8px}
.ask-panel .choice-btn{display:inline-block;margin:3px;padding:4px 12px;border-radius:4px;border:1px solid var(--border);background:var(--surface2);cursor:pointer;font-size:13px}
.ask-panel .choice-btn:hover,.ask-panel .choice-btn.selected{background:var(--accent);color:var(--bg)}
/* Input area */
.input-area{padding:12px 24px;border-top:1px solid var(--border);background:var(--surface);flex-shrink:0}
.input-row{display:flex;gap:8px;align-items:flex-end}
.input-row textarea{flex:1;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:10px 14px;font-size:14px;font-family:inherit;resize:none;min-height:44px;max-height:200px}
.input-row textarea:focus{outline:none;border-color:var(--accent)}
.input-row button{padding:10px 20px;background:var(--accent);color:var(--bg);border:none;border-radius:8px;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap}
.input-row button:hover{opacity:0.9}
.input-row button:disabled{opacity:0.4;cursor:not-allowed}
/* Scrollbar */
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--text2)}
/* Setup modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;z-index:100}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:24px;min-width:400px;max-width:600px}
.modal h2{margin-bottom:16px;color:var(--accent)}
.modal label{display:block;font-size:13px;color:var(--text2);margin-bottom:4px;margin-top:12px}
.modal select,.modal textarea{width:100%;background:var(--surface2);color:var(--text);border:1px solid var(--border);padding:8px;border-radius:4px;font-size:13px;font-family:inherit}
.modal textarea{min-height:100px}
.modal .btn-row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.modal button{padding:8px 20px;border-radius:4px;border:1px solid var(--border);cursor:pointer;font-size:13px}
.modal .btn-primary{background:var(--accent);color:var(--bg);font-weight:600;border-color:var(--accent)}
/* Task list */
.task-list{padding:8px 12px;border-top:1px solid var(--border);max-height:200px;overflow-y:auto;flex-shrink:0}
.task-list h3{font-size:11px;text-transform:uppercase;color:var(--text2);margin-bottom:6px;letter-spacing:0.5px}
.task-item{font-size:12px;padding:3px 0;display:flex;align-items:baseline;gap:4px;color:var(--text2)}
.task-item .task-icon{flex-shrink:0;width:14px;text-align:center}
.task-item .task-text{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.task-item.pending .task-icon{color:var(--text2)}
.task-item.in_progress .task-icon{color:var(--yellow)}
.task-item.in_progress .task-text{color:var(--text)}
.task-item.completed .task-icon{color:var(--green)}
.task-item.failed .task-icon{color:var(--red)}
</style>
</head>
<body>
<!-- Top bar -->
<div class="topbar">
  <span class="brand">LLM DevKit</span>
  <span class="llm-name" id="llmName"></span>
  <span class="state" id="stateInfo"></span>
  <span class="token-pill" id="tokenPill" style="display:none">
    <span class="tok-in" id="tokIn">↑0</span>
    <span class="tok-out" id="tokOut">↓0</span>
  </span>
  <label class="autoscroll-label"><input type="checkbox" id="autoscrollCheck" checked /> Autoscroll</label>
  <button class="danger" id="cancelBtn" style="display:none" onclick="cancelSession()">⏹ Cancel</button>
</div>
<!-- Layout -->
<div class="layout">
  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-section">
      <h3>Agent</h3>
      <select id="agentSelect" onchange="onAgentChange()"></select>
    </div>
    <div class="sidebar-section" style="padding-bottom:4px">
      <h3>Conversations</h3>
    </div>
    <div class="conv-list" id="convList"></div>
    <div class="new-conv-btn" onclick="newConversation()">+ New Conversation</div>
    <div class="task-list" id="taskList" style="display:none">
      <h3>Tasks</h3>
      <div id="taskItems"></div>
    </div>
  </div>
  <!-- Main pane -->
  <div class="main">
    <div class="messages" id="messages"></div>
    <div class="input-area">
      <div class="input-row">
        <textarea id="promptInput" rows="1" placeholder="Type your prompt… (Enter to send, Shift+Enter for newline)" onkeydown="onPromptKey(event)" oninput="autoGrow(this)"></textarea>
        <button id="sendBtn" onclick="sendPrompt()">▶ Send</button>
      </div>
    </div>
  </div>
</div>
<!-- Setup modal (shown for first message in new conversation) -->
<div class="modal-overlay" id="setupModal" style="display:none">
  <div class="modal">
    <h2>Start Conversation</h2>
    <label>Agent</label>
    <select id="setupAgent"></select>
    <label>System Prompt Override (optional)</label>
    <textarea id="setupSysPrompt" placeholder="Leave empty to use agent default…"></textarea>
    <div class="btn-row">
      <button onclick="cancelSetup()">Cancel</button>
      <button class="btn-primary" onclick="confirmSetup()">Start</button>
    </div>
  </div>
</div>
<script>
// State
let agents = [];
let conversations = []; // [{id, agent, systemPrompt, messages:[], acpSessionId}]
let activeConvId = null;
let running = false;
let pendingAsk = null; // {id, type, params, resolve, reject}
let setupResolve = null;
let taskEntries = []; // [{id, content, status, priority}]
let toolDefsCache = {}; // agentName -> [{name, description, parameters}]
let tokenStats = {prompt_tokens:0, completion_tokens:0, total_tokens:0, llm_calls:0};
let _renderScheduled = false;
let _streamUpdateScheduled = false;

// Init
window.onload = async () => {
  await loadAgents();
  await loadConversations();
  renderConvList();
  if (conversations.length > 0) {
    selectConversation(conversations[0].id);
  }
  connectSSE();
};

async function loadAgents() {
  const r = await fetch('/api/agents');
  agents = await r.json();
  const sel = document.getElementById('agentSelect');
  const sel2 = document.getElementById('setupAgent');
  sel.innerHTML = '';
  sel2.innerHTML = '';
  agents.forEach(a => {
    sel.innerHTML += `<option value="${a.name}">${a.name}</option>`;
    sel2.innerHTML += `<option value="${a.name}">${a.name}</option>`;
  });
}

async function loadConversations() {
  const r = await fetch('/api/conversations');
  conversations = await r.json();
}

function renderConvList() {
  const el = document.getElementById('convList');
  el.innerHTML = '';
  conversations.forEach(c => {
    const active = c.id === activeConvId ? ' active' : '';
    const label = c.title || c.id.slice(0,8);
    el.innerHTML += `<div class="conv-item${active}" onclick="selectConversation('${c.id}')">
      <span>${esc(label)}</span>
      <button class="del" onclick="event.stopPropagation();deleteConversation('${c.id}')">×</button>
    </div>`;
  });
}

async function selectConversation(id) {
  activeConvId = id;
  renderConvList();
  const conv = conversations.find(c => c.id === id);
  if (conv) {
    document.getElementById('agentSelect').value = conv.agent || agents[0]?.name || '';
    if (conv.agent) await loadToolDefs(conv.agent);
    renderMessages(conv);
    updateState(conv);
  }
}

async function deleteConversation(id) {
  await fetch('/api/conversations/' + id, {method:'DELETE'});
  conversations = conversations.filter(c => c.id !== id);
  if (activeConvId === id) {
    activeConvId = conversations[0]?.id || null;
  }
  renderConvList();
  if (activeConvId) selectConversation(activeConvId);
  else document.getElementById('messages').innerHTML = '';
}

async function newConversation() {
  // Show setup modal
  document.getElementById('setupModal').style.display = 'flex';
  document.getElementById('setupAgent').value = document.getElementById('agentSelect').value;
  document.getElementById('setupSysPrompt').value = '';
  return new Promise(r => { setupResolve = r; });
}

function cancelSetup() {
  document.getElementById('setupModal').style.display = 'none';
  setupResolve = null;
}

async function confirmSetup() {
  const agent = document.getElementById('setupAgent').value;
  const sysPrompt = document.getElementById('setupSysPrompt').value;
  document.getElementById('setupModal').style.display = 'none';
  const r = await fetch('/api/conversations', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({agent, system_prompt: sysPrompt})
  });
  const conv = await r.json();
  // Avoid duplicate if SSE conversation_created already added it
  const existingIdx = conversations.findIndex(c => c.id === conv.id);
  if (existingIdx >= 0) {
    conversations[existingIdx] = conv;
  } else {
    conversations.unshift(conv);
  }
  activeConvId = conv.id;
  renderConvList();
  selectConversation(conv.id);
  if (setupResolve) setupResolve(conv);
}

function onAgentChange() {
  // Just update sidebar display; actual agent used at conversation level
}

async function loadToolDefs(agentName) {
  if (toolDefsCache[agentName]) return toolDefsCache[agentName];
  try {
    const r = await fetch('/api/tooldefs?agent=' + encodeURIComponent(agentName));
    const defs = await r.json();
    toolDefsCache[agentName] = defs;
    return defs;
  } catch(e) { return []; }
}

function getActiveConv() {
  return conversations.find(c => c.id === activeConvId);
}

function updateState(conv) {
  const stateEl = document.getElementById('stateInfo');
  const cancelBtn = document.getElementById('cancelBtn');
  const sendBtn = document.getElementById('sendBtn');
  const llmEl = document.getElementById('llmName');
  if (!conv) {
    stateEl.innerHTML = '';
    cancelBtn.style.display = 'none';
    sendBtn.disabled = true;
    llmEl.textContent = '';
    updateTokenPill();
    return;
  }
  const agentName = conv.agent || '';
  const ag = agents.find(a => a.name === agentName);
  llmEl.textContent = ag?.llm || agentName;
  if (running) {
    stateEl.innerHTML = '<span class="running">● Running</span>';
    cancelBtn.style.display = '';
    sendBtn.disabled = true;
  } else {
    stateEl.textContent = 'Idle';
    cancelBtn.style.display = 'none';
    sendBtn.disabled = false;
  }
  // Show token stats from conversation
  if (conv.token_stats) {
    tokenStats = conv.token_stats;
  }
  updateTokenPill();
}

function updateTokenPill() {
  const pill = document.getElementById('tokenPill');
  const tokIn = document.getElementById('tokIn');
  const tokOut = document.getElementById('tokOut');
  if (tokenStats.total_tokens > 0) {
    pill.style.display = '';
    tokIn.textContent = '↑' + tokenStats.prompt_tokens;
    tokOut.textContent = '↓' + tokenStats.completion_tokens;
  } else {
    pill.style.display = 'none';
  }
}

// Render messages as bubbles
function renderMessages(conv) {
  const el = document.getElementById('messages');
  el.innerHTML = '';
  if (!conv) return;
  // System prompt bubble
  if (conv.system_prompt) {
    const spBrief = briefText(conv.system_prompt);
    el.innerHTML += bubbleHTML('system', 'System Prompt', md(conv.system_prompt), true, true, spBrief);
  }
  // Tools list bubble with individual tool defs
  const defs = toolDefsCache[conv.agent] || [];
  if (defs.length > 0) {
    let toolsHTML = defs.map(t => {
      let desc = t.description ? `<div class="tool-desc">${esc(t.description)}</div>` : '';
      let args = '';
      if (t.parameters && t.parameters.properties) {
        const props = t.parameters.properties;
        const required = t.parameters.required || [];
        args = Object.entries(props).map(([name, schema]) => {
          const req = required.includes(name) ? ' *' : '';
          const typ = schema.type || 'any';
          const d = schema.description ? ` — ${esc(schema.description)}` : '';
          return `<span class="tool-arg">${esc(name)}:${typ}${req}${d}</span>`;
        }).join(' ');
      }
      return `<div class="tool-entry"><span class="tool-name">${esc(t.name)}</span>${desc}<div class="tool-args">${args}</div></div>`;
    }).join('');
    el.innerHTML += bubbleHTML('tools', `Available Tools (${defs.length})`, toolsHTML, true, true, `${defs.length} tools`);
  } else if (conv.tools && conv.tools.length > 0) {
    const toolsHTML = conv.tools.map(t => `<span class="tool-box">${esc(t)}</span>`).join(' ');
    el.innerHTML += bubbleHTML('tools', 'Available Tools', toolsHTML, true, true, conv.tools.join(', '));
  }
  // Messages
  (conv.messages || []).forEach(m => {
    el.innerHTML += renderBubble(m);
  });
  scrollToBottom();
}

function renderBubble(m) {
  switch(m.type) {
    case 'user': return bubbleHTML('user', 'You', md(m.content), false, false);
    case 'llm': return bubbleHTML('llm', 'Assistant', md(m.content), false, false);
    case 'thinking': return bubbleHTML('thinking', 'Thinking', md(m.content), false, true, briefText(m.content));
    case 'tool_request': return renderToolRequest(m);
    case 'tool_response': return renderToolResponse(m);
    case 'ask_open_ended': return renderAskOpenEnded(m);
    case 'ask_exec': return renderAskExec(m);
    case 'ask_multiple_choice': return renderAskMultipleChoice(m);
    case 'error': return bubbleHTML('error', 'Error', esc(m.content), false, true, briefText(m.content));
    default: return bubbleHTML('system', m.type, esc(m.content||''), false, true, briefText(m.content));
  }
}

function renderToolRequest(m) {
  let title = esc(m.name || 'Tool');
  let argsHTML = '';
  let parsed = null;
  try { parsed = JSON.parse(m.content); } catch(e) {}
  if (parsed) {
    if (parsed.title) title = esc(parsed.title);
    else if (parsed.name) title = esc(parsed.name);
    // Build args table from the parsed content
    const argEntries = [];
    // Look for arguments/input/rawInput object (ACP uses rawInput)
    let args = null;
    if (parsed.arguments && typeof parsed.arguments === 'object') args = parsed.arguments;
    else if (parsed.input && typeof parsed.input === 'object') args = parsed.input;
    else if (parsed.rawInput && typeof parsed.rawInput === 'object') args = parsed.rawInput;
    else if (typeof parsed.rawInput === 'string') { try { args = JSON.parse(parsed.rawInput); } catch(e2) {} }
    else if (parsed.params && typeof parsed.params === 'object') args = parsed.params;
    // Last resort: treat all non-meta keys as args
    if (!args && typeof parsed === 'object') {
      const skip = new Set(['title','name','toolCallId','toolCallID','id','status','kind','content','_meta','locations','rawOutput','rawInput','arguments','input']);
      const candidates = Object.keys(parsed).filter(k => !skip.has(k));
      if (candidates.length > 0) {
        args = {};
        candidates.forEach(k => args[k] = parsed[k]);
      }
    }
    if (args) {
      for (const [k, v] of Object.entries(args)) {
        const val = typeof v === 'string' ? esc(v) : esc(JSON.stringify(v, null, 2));
        argEntries.push(`<tr><td class="arg-name">${esc(k)}</td><td class="arg-val">${val}</td></tr>`);
      }
    }
    if (argEntries.length > 0) {
      argsHTML = `<table class="tool-args-table">${argEntries.join('')}</table>`;
    }
  }
  const brief = briefToolReq(m);
  return bubbleHTML('tool-req', `⚙ ${title}`, argsHTML, true, true, brief);
}

function renderToolResponse(m) {
  let name = m.name || '';
  // Try to make a nicer display
  const brief = briefText(m.content);
  const content = `<pre>${esc(m.content)}</pre>`;
  return bubbleHTML('tool-resp', `📋 ${esc(name)}`, content, true, true, brief);
}

function briefText(s) {
  if (!s) return '';
  const line = String(s).split('\n')[0].replace(/\r/g, '');
  return esc(line.length > 100 ? line.slice(0, 100) + '…' : line);
}

function briefToolReq(m) {
  try {
    const obj = JSON.parse(m.content);
    const name = obj.title || m.name || '';
    let args = '';
    let argsObj = null;
    if (obj.arguments && typeof obj.arguments === 'object') argsObj = obj.arguments;
    else if (obj.input && typeof obj.input === 'object') argsObj = obj.input;
    else if (obj.rawInput && typeof obj.rawInput === 'object') argsObj = obj.rawInput;
    if (argsObj) {
      args = Object.entries(argsObj).map(([k,v]) => `${esc(k)}: ${esc(String(v).substring(0,50))}`).join(' | ');
    } else if (obj.input_schema && obj.input_schema.properties) {
      args = Object.keys(obj.input_schema.properties).map(k => esc(k)).join(', ');
    } else if (!args && m.content) {
      const fallback = m.content.split('\n')[0];
      return esc(fallback.length > 100 ? fallback.slice(0,100)+'…' : fallback);
    }
    return esc(name) + (args ? ' | ' + args : '');
  } catch(e) {
    return briefText(m.content);
  }
}

function bubbleHTML(cls, label, content, raw, collapsed, brief) {
  const col = collapsed ? ' collapsed' : '';
  const coll = collapsed ? ' collapsible' : '';
  const briefLine = brief ? `<div class="bubble-brief">${brief}</div>` : '';
  return `<div class="bubble bubble-${cls}${col}${coll}">
    <div class="bubble-label" onclick="this.parentElement.classList.toggle('collapsed')">${label}${briefLine}</div>
    <div class="bubble-content">${raw ? content : content}</div>
  </div>`;
}

function md(text) {
  if (!text) return '';
  try { return marked.parse(text); } catch(e) { return esc(text); }
}

function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function scrollToBottom() {
  if (!document.getElementById('autoscrollCheck').checked) return;
  const el = document.getElementById('messages');
  el.scrollTop = el.scrollHeight;
}

// Throttled render: coalesce rapid updates into a single rAF
function scheduleRender(conv) {
  if (_renderScheduled) return;
  _renderScheduled = true;
  requestAnimationFrame(() => {
    _renderScheduled = false;
    const c = conv || getActiveConv();
    if (c) {
      renderMessages(c);
      scrollToBottom();
    }
  });
}

// Incremental update for streaming text: only update last bubble DOM
function updateStreamingBubble(conv) {
  const el = document.getElementById('messages');
  const last = conv.messages[conv.messages.length - 1];
  if (!last || (last.type !== 'llm' && last.type !== 'thinking')) return false;
  const bubbles = el.querySelectorAll('.bubble-' + last.type);
  const lastBubble = bubbles[bubbles.length - 1];
  if (!lastBubble) return false;
  const contentEl = lastBubble.querySelector('.bubble-content');
  if (!contentEl) return false;
  contentEl.innerHTML = md(last.content);
  const briefEl = lastBubble.querySelector('.bubble-brief');
  if (briefEl) briefEl.textContent = briefText(last.content);
  return true;
}

function autoGrow(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 200) + 'px';
}

function onPromptKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendPrompt();
  }
  // Shift+Enter inserts newline (default behavior)
}

async function sendPrompt() {
  const input = document.getElementById('promptInput');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  input.style.height = 'auto';

  let conv = getActiveConv();
  if (!conv) {
    // Force new conversation via modal
    await newConversation();
    conv = getActiveConv();
    if (!conv) return;
  }

  // First message needs session init
  if (!conv.acp_session_id) {
    const initR = await fetch('/api/conversations/' + conv.id + '/init', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({prompt: text})
    });
    const data = await initR.json();
    if (data.error) { alert(data.error); return; }
    conv = data.conversation || conv;
    // Update in list
    const idx = conversations.findIndex(c => c.id === conv.id);
    if (idx >= 0) conversations[idx] = conv;
    running = true;
    taskEntries = [];
    renderTaskList();
    if (conv.agent) await loadToolDefs(conv.agent);
    renderMessages(conv);
    updateState(conv);
    return;
  }

  // Send prompt to existing session
  conv.messages.push({type:'user', content: text});
  renderMessages(conv);
  running = true;
  taskEntries = [];
  renderTaskList();
  updateState(conv);

  try {
    const r = await fetch('/api/conversations/' + conv.id + '/prompt', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({prompt: text})
    });
    const data = await r.json();
    if (data.conversation) {
      Object.assign(conv, data.conversation);
    }
  } catch(e) {
    conv.messages.push({type:'error', content: 'Fetch error: ' + e.message});
  }
  running = false;
  renderMessages(conv);
  updateState(conv);
  scrollToBottom();
}

async function cancelSession() {
  const conv = getActiveConv();
  if (!conv) return;
  await fetch('/api/conversations/' + conv.id + '/cancel', {method:'POST'});
  running = false;
  taskEntries = taskEntries.map(t => t.status === 'in_progress' ? {...t, status: 'completed'} : t);
  renderTaskList();
  updateState(conv);
}

// SSE for real-time updates
function connectSSE() {
  const es = new EventSource('/api/events');
  es.onmessage = (e) => {
    const data = JSON.parse(e.data);
    handleEvent(data);
  };
  es.onerror = () => {
    setTimeout(connectSSE, 3000);
  };
}

function handleEvent(ev) {
  // Global events (no conversation_id)
  if (ev.event === 'conversation_created') {
    if (!conversations.find(c => c.id === ev.data?.id)) {
      conversations.unshift(ev.data);
      renderConvList();
    }
    return;
  }
  if (ev.event === 'conversation_deleted') {
    conversations = conversations.filter(c => c.id !== ev.data?.id);
    if (activeConvId === ev.data?.id) {
      activeConvId = conversations[0]?.id || null;
    }
    renderConvList();
    if (activeConvId) selectConversation(activeConvId);
    return;
  }
  if (ev.event === 'conversation_updated') {
    const idx = conversations.findIndex(c => c.id === ev.data?.id);
    if (idx >= 0) {
      // Merge: update metadata but keep local message state (_merging, answered, etc.)
      const local = conversations[idx];
      const remote = ev.data;
      Object.assign(local, {
        title: remote.title,
        agent: remote.agent,
        system_prompt: remote.system_prompt,
        tools: remote.tools,
        token_stats: remote.token_stats,
        acp_session_id: remote.acp_session_id
      });
    }
    renderConvList();
    if (activeConvId === ev.data?.id) {
      scheduleRender(getActiveConv());
    }
    return;
  }

  const conv = conversations.find(c => c.id === ev.conversation_id);
  if (!conv) return;
  switch(ev.event) {
    case 'session_update':
      handleSessionUpdate(conv, ev.data);
      break;
    case 'ask_open_ended':
      handleAskOpenEnded(conv, ev);
      break;
    case 'ask_exec':
      handleAskExec(conv, ev);
      break;
    case 'ask_multiple_choice':
      handleAskMultipleChoice(conv, ev);
      break;
    case 'state':
      running = ev.data?.running || false;
      if (ev.data && !ev.data.running) {
        taskEntries = taskEntries.map(t => t.status === 'in_progress' ? {...t, status: 'completed'} : t);
        renderTaskList();
      }
      updateState(conv);
      break;
    case 'token_stats':
      if (ev.data) {
        if (!conv.token_stats) conv.token_stats = {prompt_tokens:0,completion_tokens:0,total_tokens:0,llm_calls:0};
        conv.token_stats.prompt_tokens += ev.data.prompt_tokens || 0;
        conv.token_stats.completion_tokens += ev.data.completion_tokens || 0;
        conv.token_stats.total_tokens += ev.data.total_tokens || 0;
        conv.token_stats.llm_calls += ev.data.llm_calls || 0;
        tokenStats = conv.token_stats;
        updateTokenPill();
      }
      break;
  }
  if (conv.id === activeConvId) {
    scheduleRender(conv);
  }
}

function handleSessionUpdate(conv, bubble) {
  // bubble is a BubbleMessage from the server
  if (!bubble || !bubble.type) return;

  // Skip ask types — handled by dedicated SSE event handlers to avoid double bubbles
  if (bubble.type === 'ask_open_ended' || bubble.type === 'ask_exec' || bubble.type === 'ask_multiple_choice') return;

  // Merge streaming text bubbles
  if (bubble.type === 'llm' || bubble.type === 'thinking') {
    const last = conv.messages[conv.messages.length - 1];
    if (last && last.type === bubble.type && last._merging) {
      last.content += bubble.content;
      // Incremental DOM update: avoid full re-render during streaming
      if (conv.id === activeConvId && updateStreamingBubble(conv)) {
        if (!_streamUpdateScheduled) {
          _streamUpdateScheduled = true;
          requestAnimationFrame(() => {
            _streamUpdateScheduled = false;
            scrollToBottom();
          });
        }
        return;
      }
    } else {
      conv.messages.push({type: bubble.type, content: bubble.content, _merging: true});
    }
    if (conv.id === activeConvId) scheduleRender(conv);
    return;
  }

  // Tool calls — track as tasks
  if (bubble.type === 'tool_request') {
    conv.messages.push({type:'tool_request', name: bubble.name, content: bubble.content});
    return;
  }

  if (bubble.type === 'tool_response') {
    conv.messages.push({type:'tool_response', name: bubble.name, content: bubble.content});
    // Parse task management tool responses
    updateTasksFromToolResponse(bubble.name, bubble.content);
    return;
  }

  if (bubble.type === 'error') {
    conv.messages.push({type:'error', content: bubble.content});
    return;
  }

  // Fallback: push as-is
  conv.messages.push(bubble);
}

// Task tracking from tool responses
function updateTasksFromToolResponse(toolName, content) {
  const lines = content.split('\n').filter(l => l.trim());
  if (toolName === 'task_create') {
    // Parse: "Created ID: 3\nCurrent Tasks:\n1. [ ] Fix something\n2. [X] Done thing"
    // or: "Created ID: 2.1\nCurrent Tasks:\n1. [_] Working\n  2.1. [ ] Sub task"
    for (const line of lines) {
      const m = line.match(/^(\d+(?:\.\d+)*)\.\s*\[([ _Xx])\]\s*(.*)/);
      if (m) {
        const id = m[1];
        const statusChar = m[2];
        const desc = m[3].trim();
        let status = 'pending';
        if (statusChar === '_' || statusChar === 'x' || statusChar === 'X') status = 'in_progress';
        if (statusChar === 'X' || statusChar === 'x') status = 'completed';
        const existing = taskEntries.find(t => t.id === id);
        if (existing) {
          existing.status = status;
          existing.content = desc;
        } else {
          taskEntries.push({id, content: desc, status});
        }
      }
    }
  } else if (toolName === 'task_set_status') {
    // Parse: "ID: 2 set to in_progress\nCurrent Tasks:\n..."
    for (const line of lines) {
      const m = line.match(/^(\d+(?:\.\d+)*)\.\s*\[([ _Xx])\]\s*(.*)/);
      if (m) {
        const id = m[1];
        const statusChar = m[2];
        const desc = m[3].trim();
        let status = 'pending';
        if (statusChar === '_') status = 'in_progress';
        if (statusChar === 'X' || statusChar === 'x') status = 'completed';
        const existing = taskEntries.find(t => t.id === id);
        if (existing) {
          existing.status = status;
          existing.content = desc;
        } else {
          taskEntries.push({id, content: desc, status});
        }
      }
    }
  } else if (toolName === 'tasks_list') {
    // Full task list refresh
    const parsed = [];
    for (const line of lines) {
      const m = line.match(/^(\d+(?:\.\d+)*)\.\s*\[([ _Xx])\]\s*(.*)/);
      if (m) {
        const statusChar = m[2];
        let status = 'pending';
        if (statusChar === '_') status = 'in_progress';
        if (statusChar === 'X' || statusChar === 'x') status = 'completed';
        parsed.push({id: m[1], content: m[3].trim(), status});
      }
    }
    if (parsed.length > 0) taskEntries = parsed;
  } else if (toolName === 'tasks_clear') {
    taskEntries = [];
  } else if (toolName === 'task_delete') {
    // Parse: "Deleted ID: 3\nCurrent Tasks:\n..."
    for (const line of lines) {
      const m = line.match(/^(\d+(?:\.\d+)*)\.\s*\[([ _Xx])\]\s*(.*)/);
      if (m) {
        const id = m[1];
        const statusChar = m[2];
        const desc = m[3].trim();
        let status = 'pending';
        if (statusChar === '_') status = 'in_progress';
        if (statusChar === 'X' || statusChar === 'x') status = 'completed';
        const existing = taskEntries.find(t => t.id === id);
        if (existing) {
          existing.status = status;
          existing.content = desc;
        } else {
          taskEntries.push({id, content: desc, status});
        }
      }
    }
  }
  renderTaskList();
}

// Task list rendering
function renderTaskList() {
  const el = document.getElementById('taskItems');
  const container = document.getElementById('taskList');
  if (taskEntries.length === 0) {
    container.style.display = 'none';
    return;
  }
  container.style.display = '';
  const icons = {pending: '○', in_progress: '◐', completed: '●', failed: '✕'};
  el.innerHTML = taskEntries.map(t => {
    const icon = icons[t.status] || '○';
    return `<div class="task-item ${t.status}">
      <span class="task-icon">${icon}</span>
      <span class="task-text" title="${esc(t.content)}">${esc(t.content)}</span>
    </div>`;
  }).join('');
}

// Ask tool: open-ended
function handleAskOpenEnded(conv, ev) {
  const msg = {type:'ask_open_ended', id: ev.data.ask_id, question: ev.data.question, answered: false, answer: ''};
  conv.messages.push(msg);
  if (conv.id === activeConvId) renderMessages(conv);
}

function renderAskOpenEnded(m) {
  if (m.answered) {
    return bubbleHTML('tool-resp', 'Your Answer', esc(m.answer), false, true, briefText(m.answer));
  }
  return `<div class="ask-panel" id="ask-${m.id}">
    <div class="ask-title">💬 Question</div>
    <p>${md(m.question)}</p>
    <textarea id="ask-input-${m.id}" rows="3" placeholder="Your answer…"></textarea>
    <div class="btn-row">
      <button class="btn-approve" onclick="answerAsk('${m.id}', document.getElementById('ask-input-${m.id}').value)">Submit</button>
    </div>
  </div>`;
}

// Ask tool: exec
function handleAskExec(conv, ev) {
  const msg = {
    type:'ask_exec', id: ev.data.ask_id,
    cmdline: ev.data.cmdline,
    timeout: ev.data.timeout || 30,
    answered: false, approved: false, answer: ''
  };
  conv.messages.push(msg);
  if (conv.id === activeConvId) renderMessages(conv);
}

function renderAskExec(m) {
  if (m.answered) {
    const status = m.approved ? '✅ Approved' : '❌ Denied';
    return bubbleHTML(m.approved ? 'tool-resp' : 'error', `ask_exec ${status}`, esc(m.approved ? m.cmdline : 'Denied: ' + m.answer), false, true, `${status}: ${esc(m.approved ? m.cmdline : m.answer)}`);
  }
  return `<div class="ask-panel" id="ask-${m.id}">
    <div class="ask-title">⚡ Execute Command</div>
    <label style="color:var(--text2);font-size:12px">Command:</label>
    <input id="ask-cmd-${m.id}" value="${esc(m.cmdline)}" />
    <label style="color:var(--text2);font-size:12px">Timeout (seconds):</label>
    <input id="ask-timeout-${m.id}" type="number" value="${m.timeout}" min="1" />
    <div class="btn-row">
      <button class="btn-approve" onclick="answerExec('${m.id}', true)">Approve</button>
      <button class="btn-deny" onclick="answerExec('${m.id}', false)">Deny</button>
    </div>
    <div class="deny-reason" id="deny-row-${m.id}" style="display:none">
      <label style="color:var(--text2);font-size:12px">Reason for denial (optional):</label>
      <input id="ask-deny-${m.id}" placeholder="Explain to the agent…" />
      <button class="btn-deny" onclick="submitDeny('${m.id}')" style="margin-top:4px">Submit Deny</button>
    </div>
  </div>`;
}

// Ask tool: multiple choice
function handleAskMultipleChoice(conv, ev) {
  const msg = {
    type:'ask_multiple_choice', id: ev.data.ask_id,
    question: ev.data.question,
    choices: ev.data.choices || [],
    allow_open_ended: ev.data.allow_open_ended || false,
    answered: false, answer: ''
  };
  conv.messages.push(msg);
  if (conv.id === activeConvId) renderMessages(conv);
}

function renderAskMultipleChoice(m) {
  if (m.answered) {
    return bubbleHTML('tool-resp', 'Your Choice', esc(m.answer), false, true, briefText(m.answer));
  }
  let choices = m.choices.map((c,i) =>
    `<button class="choice-btn" onclick="answerChoice('${m.id}', ${i}, this)">${esc(c)}</button>`
  ).join('');
  let openEnd = '';
  if (m.allow_open_ended) {
    openEnd = `<div style="margin-top:8px">
      <input id="ask-custom-${m.id}" placeholder="Type your own response…" style="width:calc(100% - 80px)" />
      <button class="choice-btn" onclick="answerCustom('${m.id}')">Submit</button>
    </div>`;
  }
  return `<div class="ask-panel" id="ask-${m.id}">
    <div class="ask-title">❓ Multiple Choice</div>
    <p>${md(m.question)}</p>
    <div>${choices}</div>
    ${openEnd}
  </div>`;
}

// Answer handlers
async function answerAsk(askId, answer) {
  await fetch('/api/ask/' + askId, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({type:'open_ended', answer})
  });
}

function answerExec(askId, approved) {
  if (approved) {
    const cmd = document.getElementById('ask-cmd-' + askId).value;
    const timeout = parseInt(document.getElementById('ask-timeout-' + askId).value) || 30;
    fetch('/api/ask/' + askId, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({type:'exec', approved:true, cmdline:cmd, timeout})
    });
    // Update local
    markAskAnswered(askId, true, cmd);
  } else {
    document.getElementById('deny-row-' + askId).style.display = 'block';
  }
}

function submitDeny(askId) {
  const reason = document.getElementById('ask-deny-' + askId).value;
  fetch('/api/ask/' + askId, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({type:'exec', approved:false, deny_reason: reason})
  });
  markAskAnswered(askId, false, reason);
}

function answerChoice(askId, idx, btn) {
  const conv = getActiveConv();
  const msg = conv?.messages?.find(m => m.id === askId);
  const choice = msg?.choices?.[idx] || '';
  fetch('/api/ask/' + askId, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({type:'multiple_choice', answer: choice})
  });
  markAskAnswered(askId, false, choice);
}

function answerCustom(askId) {
  const answer = document.getElementById('ask-custom-' + askId)?.value || '';
  if (!answer) return;
  fetch('/api/ask/' + askId, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({type:'multiple_choice', answer})
  });
  markAskAnswered(askId, false, answer);
}

function markAskAnswered(askId, approved, answer) {
  conversations.forEach(c => {
    const m = c.messages?.find(m => m.id === askId);
    if (m) {
      m.answered = true;
      m.approved = approved;
      m.answer = answer || '';
    }
  });
  const conv = getActiveConv();
  if (conv) renderMessages(conv);
}
