<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LLM DevKit</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
:root{--cat-bg:#1e1e2e;--cat-surface:#2a2a3c;--cat-surface2:#33334a;--cat-border:#444466;--cat-text:#cdd6f4;--cat-text2:#a6adc8;--cat-accent:#89b4fa;--cat-green:#a6e3a1;--cat-red:#f38ba8;--cat-yellow:#f9e2af;--cat-mauve:#cba6f7;--cat-peach:#fab387;--cat-teal:#94e2d5}
html,body{height:100%;overflow:hidden;background:var(--cat-bg)}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--cat-border);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--cat-text2)}
.chat-layout{display:flex;flex-direction:column;height:100vh}
.chat-body{display:flex;flex:1;overflow:hidden}
.chat-sidebar{width:260px;min-width:200px;background:var(--cat-surface);border-right:1px solid var(--cat-border);display:flex;flex-direction:column;flex-shrink:0}
.chat-main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.chat-messages{flex:1;overflow-y:auto;padding:1rem 1.5rem;display:flex;flex-direction:column;gap:.75rem}
.bubble{max-width:85%;padding:.625rem .875rem;border-radius:.625rem;font-size:.875rem;line-height:1.5;word-wrap:break-word;position:relative}
.bubble pre{background:var(--cat-bg);padding:.5rem;border-radius:.25rem;overflow-x:auto;margin:.375rem 0;font-size:.8125rem}
.bubble code{background:var(--cat-bg);padding:1px 4px;border-radius:.1875rem;font-size:.8125rem}
.bubble pre code{background:none;padding:0}
.bubble p{margin:.25rem 0}
.bubble ul,.bubble ol{margin:.25rem 0 .25rem 1.25rem}
.bubble h1,.bubble h2,.bubble h3,.bubble h4{margin:.5rem 0 .25rem}
.bubble table{border-collapse:collapse;margin:.375rem 0}
.bubble th,.bubble td{border:1px solid var(--cat-border);padding:.25rem .5rem;font-size:.8125rem}
.bubble th{background:var(--cat-surface2)}
.bubble-system{background:var(--cat-surface2);color:var(--cat-text2);align-self:center;font-style:italic;font-size:.8125rem;max-width:95%}
.bubble-tools{background:var(--cat-surface2);color:var(--cat-teal);align-self:center;max-width:95%;font-size:.8125rem}
.bubble-tools .tool-box{display:inline-block;background:var(--cat-bg);border:1px solid var(--cat-border);border-radius:.25rem;padding:.25rem .5rem;margin:2px;font-size:.75rem}
.bubble-tools .tool-entry{background:var(--cat-bg);border:1px solid var(--cat-border);border-radius:.25rem;padding:.375rem .625rem;margin:.25rem 0}
.bubble-tools .tool-name{font-weight:600;color:var(--cat-teal);font-family:monospace;font-size:.75rem}
.bubble-tools .tool-desc{color:var(--cat-text2);font-size:.75rem;margin:2px 0}
.bubble-tools .tool-args{margin-top:.1875rem}
.bubble-tools .tool-arg{display:inline-block;background:var(--cat-surface);border:1px solid var(--cat-border);border-radius:.1875rem;padding:1px 5px;margin:1px;font-size:.6875rem;font-family:monospace;color:var(--cat-peach)}
.bubble-user{background:#3b3b5c;align-self:flex-end;border-bottom-right-radius:2px}
.bubble-llm{background:var(--cat-surface2);align-self:flex-start;border-bottom-left-radius:2px}
.bubble-thinking{background:transparent;border:1px dashed var(--cat-border);color:var(--cat-text2);align-self:flex-start;font-style:italic;font-size:.8125rem}
.bubble-tool-req{background:var(--cat-surface2);border-left:3px solid var(--cat-yellow);align-self:flex-start;font-size:.8125rem;max-width:90%}
.bubble-tool-resp{background:var(--cat-surface2);border-left:3px solid var(--cat-green);align-self:flex-start;font-size:.8125rem;max-width:90%}
.bubble-error{background:#3b2030;border-left:3px solid var(--cat-red);color:var(--cat-red);align-self:center}
.tool-args-table{border-collapse:collapse;margin:.375rem 0;width:100%}
.tool-args-table td{padding:.125rem .5rem;font-size:.75rem;border-bottom:1px solid var(--cat-border)}
.tool-args-table .arg-name{color:var(--cat-peach);font-family:monospace;font-weight:600;white-space:nowrap;width:1%}
.tool-args-table .arg-val{color:var(--cat-text);word-break:break-all}
.tool-meta{display:inline-block;background:var(--cat-bg);border:1px solid var(--cat-border);border-radius:.1875rem;padding:0 5px;font-size:.6875rem;color:var(--cat-text2);margin-right:4px}
.bubble-label{font-size:.6875rem;text-transform:uppercase;color:var(--cat-text2);margin-bottom:.25rem;letter-spacing:.5px;display:flex;align-items:center;gap:.5rem}
.bubble-ts{font-size:.625rem;color:var(--cat-text2);opacity:.6;text-transform:none;letter-spacing:0;font-weight:400}
.bubble-system .bubble-label{color:var(--cat-mauve)}
.bubble-user .bubble-label{color:var(--cat-accent)}
.bubble-llm .bubble-label{color:var(--cat-green)}
.bubble-thinking .bubble-label{color:var(--cat-text2)}
.bubble-tool-req .bubble-label{color:var(--cat-yellow)}
.bubble-tool-resp .bubble-label{color:var(--cat-teal)}
.bubble.collapsed .bubble-content{display:none}
.bubble.collapsed .bubble-brief{display:block}
.bubble .bubble-brief{display:none;color:var(--cat-text2);font-size:.75rem;font-style:normal;font-weight:400;text-transform:none;letter-spacing:0;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.bubble.collapsible .bubble-label{cursor:pointer}
.bubble{cursor:default}
.ask-panel{background:var(--cat-surface2);border:2px solid var(--cat-accent);border-radius:.5rem;padding:.875rem;margin:.5rem 0;max-width:90%;align-self:center}
.ask-panel .ask-title{font-weight:700;color:var(--cat-accent);margin-bottom:.5rem;font-size:.875rem}
.ask-panel .choice-btn{display:inline-block;margin:3px;padding:.25rem .75rem;border-radius:.25rem;border:1px solid var(--cat-border);background:var(--cat-surface2);cursor:pointer;font-size:.8125rem;color:var(--cat-text)}
.ask-panel .choice-btn:hover,.ask-panel .choice-btn.selected{background:var(--cat-accent);color:var(--cat-bg)}
@keyframes pulse-dot{0%,100%{opacity:1}50%{opacity:.3}}
.status-dot.running{background:var(--cat-green);animation:pulse-dot 1.5s ease-in-out infinite}
.status-dot.idle{background:var(--cat-text2);opacity:.4}
.task-item.in_progress .task-icon{color:var(--cat-yellow)}
.task-item.in_progress .task-text{color:var(--cat-text)}
.task-item.completed .task-icon{color:var(--cat-green)}
.task-item.failed .task-icon{color:var(--cat-red)}
</style>
</head>
<body>
<div class="chat-layout">
<!-- Top bar -->
<nav class="d-flex align-items-center gap-3 px-3 py-2 border-bottom flex-shrink-0" style="background:var(--cat-surface);min-height:44px">
  <span class="fw-bold" style="color:var(--cat-accent);font-size:.875rem">LLM DevKit</span>
  <span class="small" style="color:var(--cat-mauve)" id="llmName"></span>
  <span class="small flex-grow-1" style="color:var(--cat-text2)" id="stateInfo"></span>
  <span class="d-none d-inline-flex align-items-center gap-2 border rounded-pill px-2 py-0 small" style="background:var(--cat-surface2);border-color:var(--cat-border)!important;color:var(--cat-text2)" id="tokenPill">
    <span id="tokTotal">0 tokens</span>
  </span>
  <div class="form-check form-switch mb-0 d-inline-flex align-items-center gap-1 small" style="color:var(--cat-text2)">
    <input class="form-check-input" type="checkbox" id="autoscrollCheck" checked style="cursor:pointer">
    <label class="form-check-label" for="autoscrollCheck" style="cursor:pointer;font-size:.75rem">Autoscroll</label>
  </div>
  <button class="btn btn-sm btn-outline-danger d-none" id="cancelBtn" onclick="cancelSession()">⏹ Cancel</button>
</nav>
<!-- Body -->
<div class="chat-body">
  <!-- Sidebar -->
  <div class="chat-sidebar">
    <div class="p-3 border-bottom">
      <h6 class="text-uppercase mb-2" style="font-size:.6875rem;letter-spacing:.5px;color:var(--cat-text2)">Agent</h6>
      <select class="form-select form-select-sm" id="agentSelect" onchange="onAgentChange()"></select>
    </div>
    <div class="px-3 pt-3 pb-1 border-bottom">
      <h6 class="text-uppercase mb-0" style="font-size:.6875rem;letter-spacing:.5px;color:var(--cat-text2)">Conversations</h6>
    </div>
    <div class="flex-grow-1 overflow-auto px-1 py-1" id="convList"></div>
    <div class="mx-2 my-2 py-1 text-center rounded small" style="border:1px dashed var(--cat-border);color:var(--cat-text2);cursor:pointer;background:var(--cat-surface2)" onclick="newConversation()" onmouseover="this.style.borderColor='var(--cat-accent)';this.style.color='var(--cat-accent)'" onmouseout="this.style.borderColor='var(--cat-border)';this.style.color='var(--cat-text2)'">+ New Conversation</div>
    <div class="border-top overflow-auto flex-shrink-0 px-3 py-2" id="taskList" style="display:none;max-height:200px">
      <h6 class="text-uppercase mb-1" style="font-size:.6875rem;letter-spacing:.5px;color:var(--cat-text2)">Tasks</h6>
      <div id="taskItems"></div>
    </div>
  </div>
  <!-- Main pane -->
  <div class="chat-main">
    <div class="chat-messages" id="messages"></div>
    <div class="px-3 py-2 border-top flex-shrink-0" style="background:var(--cat-surface)">
      <div class="d-flex gap-2 align-items-end">
        <textarea class="form-control flex-grow-1" id="promptInput" rows="1" placeholder="Type your prompt… (Enter to send, Shift+Enter for newline)" onkeydown="onPromptKey(event)" oninput="autoGrow(this)" style="background:var(--cat-bg);border-color:var(--cat-border);border-radius:.5rem;min-height:44px;max-height:200px;resize:none"></textarea>
        <button class="btn fw-semibold text-nowrap" id="sendBtn" onclick="sendPrompt()" style="background:var(--cat-accent);color:var(--cat-bg);border-radius:.5rem;padding:.625rem 1.25rem;font-size:.875rem">▶ Send</button>
      </div>
    </div>
  </div>
</div>
</div>

<!-- Setup modal (Bootstrap modal) -->
<div class="modal fade" id="setupModal" tabindex="-1" data-bs-backdrop="static">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border" style="background:var(--cat-surface);border-color:var(--cat-border)!important">
      <div class="modal-header border-0 pb-0">
        <h5 class="modal-title" style="color:var(--cat-accent)">Start Conversation</h5>
      </div>
      <div class="modal-body">
        <label class="form-label small" style="color:var(--cat-text2)">Agent</label>
        <select class="form-select form-select-sm mb-3" id="setupAgent"></select>
        <label class="form-label small" style="color:var(--cat-text2)">System Prompt Override (optional)</label>
        <textarea class="form-control form-control-sm" id="setupSysPrompt" rows="4" placeholder="Leave empty to use agent default…"></textarea>
      </div>
      <div class="modal-footer border-0 pt-0">
        <button type="button" class="btn btn-sm btn-outline-secondary" onclick="cancelSetup()">Cancel</button>
        <button type="button" class="btn btn-sm fw-semibold" style="background:var(--cat-accent);color:var(--cat-bg)" onclick="confirmSetup()">Start</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<script>
// State
let agents = [];
let conversations = [];
let activeConvId = null;
let running = false;
let pendingAsk = null;
let setupResolve = null;
let taskEntries = [];
let toolCallIdToName = {};
let toolDefsCache = {};
let tokenStats = {prompt_tokens:0, completion_tokens:0, total_tokens:0, llm_calls:0};
let _renderScheduled = false;
let _streamUpdateScheduled = false;
let setupModalEl = null;

// Init
window.onload = async () => {
  setupModalEl = new bootstrap.Modal(document.getElementById('setupModal'));
  await loadAgents();
  await loadConversations();
  renderConvList();
  if (conversations.length > 0) {
    selectConversation(conversations[0].id);
  }
  connectSSE();
};

async function loadAgents() {
  const r = await fetch('/api/agents');
  agents = await r.json();
  const sel = document.getElementById('agentSelect');
  const sel2 = document.getElementById('setupAgent');
  sel.innerHTML = '';
  sel2.innerHTML = '';
  agents.forEach(a => {
    sel.innerHTML += `<option value="${a.name}">${a.name}</option>`;
    sel2.innerHTML += `<option value="${a.name}">${a.name}</option>`;
  });
}

async function loadConversations() {
  const r = await fetch('/api/conversations');
  conversations = await r.json();
}

function renderConvList() {
  const el = document.getElementById('convList');
  el.innerHTML = '';
  conversations.forEach(c => {
    const active = c.id === activeConvId ? ' active' : '';
    const label = c.title || c.id.slice(0,8);
    const statusCls = c.running ? 'running' : 'idle';
    el.innerHTML += `<div class="conv-item d-flex justify-content-between align-items-center rounded px-2 py-1 small${active}" style="cursor:pointer;color:var(--cat-text2);${active?'background:var(--cat-surface2);color:var(--cat-accent);font-weight:600':''}" data-id="${c.id}">
      <div class="d-flex align-items-center gap-1 flex-grow-1 overflow-hidden">
        <span class="status-dot ${statusCls}" style="width:8px;height:8px;border-radius:50%;flex-shrink:0"></span>
        <span class="overflow-hidden" style="text-overflow:ellipsis;white-space:nowrap">${esc(label)}</span>
      </div>
      <button class="btn btn-sm p-0 border-0 conv-del" style="color:var(--cat-red);font-size:1rem;line-height:1;display:none">×</button>
    </div>`;
  });
  // Event delegation
  el.querySelectorAll('.conv-item').forEach(item => {
    item.addEventListener('click', () => selectConversation(item.dataset.id));
    const btn = item.querySelector('.conv-del');
    btn.addEventListener('click', e => { e.stopPropagation(); deleteConversation(item.dataset.id); });
    item.addEventListener('mouseenter', () => { btn.style.display='block'; if(!item.classList.contains('active'))item.style.background='var(--cat-surface2)'; });
    item.addEventListener('mouseleave', () => { btn.style.display='none'; if(!item.classList.contains('active'))item.style.background=''; });
  });
}

async function selectConversation(id) {
  activeConvId = id;
  renderConvList();
  const conv = conversations.find(c => c.id === id);
  if (conv) {
    document.getElementById('agentSelect').value = conv.agent || agents[0]?.name || '';
    if (conv.agent) await loadToolDefs(conv.agent);
    rebuildTaskState(conv);
    renderMessages(conv);
    updateState(conv);
  }
}

function rebuildTaskState(conv) {
  toolCallIdToName = {};
  taskEntries = [];
  if (!conv?.messages) return;
  for (const m of conv.messages) {
    if (m.type === 'tool_request') {
      try {
        const parsed = JSON.parse(m.content);
        const tcId = parsed.toolCallId || parsed.toolCallID || parsed.id;
        const tcName = parsed.title || parsed.name || m.name;
        if (tcId) toolCallIdToName[tcId] = tcName;
      } catch(e) {}
    }
    if (m.type === 'tool_response') {
      const lookupKey = m.id || m.name;
      const realToolName = toolCallIdToName[lookupKey] || m.name;
      updateTasksFromToolResponse(realToolName, m.content);
    }
  }
  renderTaskList();
}

async function deleteConversation(id) {
  await fetch('/api/conversations/' + id, {method:'DELETE'});
  conversations = conversations.filter(c => c.id !== id);
  if (activeConvId === id) {
    activeConvId = conversations[0]?.id || null;
  }
  renderConvList();
  if (activeConvId) selectConversation(activeConvId);
  else document.getElementById('messages').innerHTML = '';
}

async function newConversation() {
  document.getElementById('setupAgent').value = document.getElementById('agentSelect').value;
  document.getElementById('setupSysPrompt').value = '';
  setupModalEl.show();
  return new Promise(r => { setupResolve = r; });
}

function cancelSetup() {
  setupModalEl.hide();
  setupResolve = null;
}

async function confirmSetup() {
  const agent = document.getElementById('setupAgent').value;
  const sysPrompt = document.getElementById('setupSysPrompt').value;
  setupModalEl.hide();
  const r = await fetch('/api/conversations', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({agent, system_prompt: sysPrompt})
  });
  const conv = await r.json();
  const existingIdx = conversations.findIndex(c => c.id === conv.id);
  if (existingIdx >= 0) {
    conversations[existingIdx] = conv;
  } else {
    conversations.unshift(conv);
  }
  activeConvId = conv.id;
  renderConvList();
  selectConversation(conv.id);
  if (setupResolve) setupResolve(conv);
}

function onAgentChange() {}

async function loadToolDefs(agentName) {
  if (toolDefsCache[agentName]) return toolDefsCache[agentName];
  try {
    const r = await fetch('/api/tooldefs?agent=' + encodeURIComponent(agentName));
    const defs = await r.json();
    toolDefsCache[agentName] = defs;
    return defs;
  } catch(e) { return []; }
}

function getActiveConv() {
  return conversations.find(c => c.id === activeConvId);
}

function updateState(conv) {
  const stateEl = document.getElementById('stateInfo');
  const cancelBtn = document.getElementById('cancelBtn');
  const sendBtn = document.getElementById('sendBtn');
  const llmEl = document.getElementById('llmName');
  if (!conv) {
    stateEl.innerHTML = '';
    cancelBtn.classList.add('d-none');
    sendBtn.disabled = true;
    llmEl.textContent = '';
    updateTokenPill();
    return;
  }
  const agentName = conv.agent || '';
  const ag = agents.find(a => a.name === agentName);
  llmEl.textContent = ag?.llm || agentName;
  const isRunning = conv.running || false;
  if (isRunning) {
    stateEl.innerHTML = '<span style="color:var(--cat-green);font-weight:600">● Running</span>';
    cancelBtn.classList.remove('d-none');
    sendBtn.disabled = true;
  } else {
    stateEl.textContent = 'Idle';
    cancelBtn.classList.add('d-none');
    sendBtn.disabled = false;
  }
  if (conv.token_stats) {
    tokenStats = conv.token_stats;
  }
  updateTokenPill();
}

function updateTokenPill() {
  const pill = document.getElementById('tokenPill');
  const tokTotal = document.getElementById('tokTotal');
  if (tokenStats.total_tokens > 0) {
    pill.classList.remove('d-none');
    pill.classList.add('d-inline-flex');
    tokTotal.textContent = formatTokenCount(tokenStats.total_tokens);
  } else {
    pill.classList.add('d-none');
    pill.classList.remove('d-inline-flex');
  }
}

function formatTokenCount(n) {
  if (n >= 1_000_000) return (n / 1_000_000).toFixed(1).replace(/\.0$/, '') + 'M';
  if (n >= 1_000) return (n / 1_000).toFixed(1).replace(/\.0$/, '') + 'k';
  return '' + n;
}

function renderMessages(conv) {
  const el = document.getElementById('messages');
  el.innerHTML = '';
  if (!conv) return;
  if (conv.system_prompt) {
    const spBrief = briefText(conv.system_prompt);
    el.innerHTML += bubbleHTML('system', 'System Prompt', md(conv.system_prompt), true, true, spBrief);
  }
  const defs = toolDefsCache[conv.agent] || [];
  if (defs.length > 0) {
    let toolsHTML = defs.map(t => {
      let desc = t.description ? `<div class="tool-desc">${esc(t.description)}</div>` : '';
      let args = '';
      if (t.parameters && t.parameters.properties) {
        const props = t.parameters.properties;
        const required = t.parameters.required || [];
        args = Object.entries(props).map(([name, schema]) => {
          const req = required.includes(name) ? ' *' : '';
          const typ = schema.type || 'any';
          const d = schema.description ? ` — ${esc(schema.description)}` : '';
          return `<span class="tool-arg">${esc(name)}:${typ}${req}${d}</span>`;
        }).join(' ');
      }
      return `<div class="tool-entry"><span class="tool-name">${esc(t.name)}</span>${desc}<div class="tool-args">${args}</div></div>`;
    }).join('');
    el.innerHTML += bubbleHTML('tools', `Available Tools (${defs.length})`, toolsHTML, true, true, `${defs.length} tools`);
  } else if (conv.tools && conv.tools.length > 0) {
    const toolsHTML = conv.tools.map(t => `<span class="tool-box">${esc(t)}</span>`).join(' ');
    el.innerHTML += bubbleHTML('tools', 'Available Tools', toolsHTML, true, true, conv.tools.join(', '));
  }
  (conv.messages || []).forEach(m => {
    el.innerHTML += renderBubble(m);
  });
  scrollToBottom();
}

function renderBubble(m) {
  switch(m.type) {
    case 'user': return bubbleHTML('user', 'You', md(m.content), false, false, null, m.timestamp);
    case 'llm': return bubbleHTML('llm', 'Assistant', md(m.content), false, false, null, m.timestamp);
    case 'thinking': return bubbleHTML('thinking', 'Thinking', md(m.content), false, true, briefText(m.content), m.timestamp);
    case 'tool_request': return renderToolRequest(m);
    case 'tool_response': return renderToolResponse(m);
    case 'ask_open_ended': return renderAskOpenEnded(m);
    case 'ask_exec': return renderAskExec(m);
    case 'ask_multiple_choice': return renderAskMultipleChoice(m);
    case 'error': return bubbleHTML('error', 'Error', esc(m.content), false, true, briefText(m.content), m.timestamp);
    default: return bubbleHTML('system', m.type, esc(m.content||''), false, true, briefText(m.content), m.timestamp);
  }
}

function renderToolRequest(m) {
  let title = esc(m.name || 'Tool');
  let argsHTML = '';
  let parsed = null;
  try { parsed = JSON.parse(m.content); } catch(e) {}
  if (parsed) {
    if (parsed.title) title = esc(parsed.title);
    else if (parsed.name) title = esc(parsed.name);
    const argEntries = [];
    let args = null;
    if (parsed.arguments && typeof parsed.arguments === 'object') args = parsed.arguments;
    else if (parsed.input && typeof parsed.input === 'object') args = parsed.input;
    else if (parsed.rawInput && typeof parsed.rawInput === 'object') args = parsed.rawInput;
    else if (typeof parsed.rawInput === 'string') { try { args = JSON.parse(parsed.rawInput); } catch(e2) {} }
    else if (parsed.params && typeof parsed.params === 'object') args = parsed.params;
    if (!args && typeof parsed === 'object') {
      const skip = new Set(['title','name','toolCallId','toolCallID','id','status','kind','content','_meta','locations','rawOutput','rawInput','arguments','input']);
      const candidates = Object.keys(parsed).filter(k => !skip.has(k));
      if (candidates.length > 0) {
        args = {};
        candidates.forEach(k => args[k] = parsed[k]);
      }
    }
    if (args) {
      for (const [k, v] of Object.entries(args)) {
        const val = typeof v === 'string' ? esc(v) : esc(JSON.stringify(v, null, 2));
        argEntries.push(`<tr><td class="arg-name">${esc(k)}</td><td class="arg-val">${val}</td></tr>`);
      }
    }
    if (argEntries.length > 0) {
      argsHTML = `<table class="tool-args-table">${argEntries.join('')}</table>`;
    }
  }
  const brief = briefToolReq(m);
  return bubbleHTML('tool-req', `⚙ ${title}`, argsHTML, true, false, brief, m.timestamp);
}

function renderToolResponse(m) {
  let name = m.name || '';
  if (m.id && toolCallIdToName[m.id]) name = toolCallIdToName[m.id];
  else if (toolCallIdToName[name]) name = toolCallIdToName[name];
  const brief = briefText(m.content);
  const content = `<pre>${esc(m.content)}</pre>`;
  return bubbleHTML('tool-resp', `📋 ${esc(name)}`, content, true, true, brief, m.timestamp);
}

function briefText(s) {
  if (!s) return '';
  const line = String(s).split('\n')[0].replace(/\r/g, '');
  return esc(line.length > 100 ? line.slice(0, 100) + '…' : line);
}

function briefToolReq(m) {
  try {
    const obj = JSON.parse(m.content);
    const name = obj.title || m.name || '';
    let args = '';
    let argsObj = null;
    if (obj.arguments && typeof obj.arguments === 'object') argsObj = obj.arguments;
    else if (obj.input && typeof obj.input === 'object') argsObj = obj.input;
    else if (obj.rawInput && typeof obj.rawInput === 'object') argsObj = obj.rawInput;
    if (argsObj) {
      args = Object.entries(argsObj).map(([k,v]) => `${esc(k)}: ${esc(String(v).substring(0,50))}`).join(' | ');
    } else if (obj.input_schema && obj.input_schema.properties) {
      args = Object.keys(obj.input_schema.properties).map(k => esc(k)).join(', ');
    } else if (!args && m.content) {
      const fallback = m.content.split('\n')[0];
      return esc(fallback.length > 100 ? fallback.slice(0,100)+'…' : fallback);
    }
    return esc(name) + (args ? ' | ' + args : '');
  } catch(e) {
    return briefText(m.content);
  }
}

function bubbleHTML(cls, label, content, raw, collapsed, brief, timestamp) {
  const col = collapsed ? ' collapsed' : '';
  const coll = collapsed ? ' collapsible' : '';
  const briefLine = brief ? `<div class="bubble-brief">${brief}</div>` : '';
  const tsLine = timestamp ? `<span class="bubble-ts">${formatTime(timestamp)}</span>` : '';
  return `<div class="bubble bubble-${cls}${col}${coll}">
    <div class="bubble-label" onclick="this.parentElement.classList.toggle('collapsed')">${label}${tsLine}${briefLine}</div>
    <div class="bubble-content">${raw ? content : content}</div>
  </div>`;
}

function formatTime(ts) {
  try {
    const d = new Date(ts);
    return d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'});
  } catch(e) { return ''; }
}

function md(text) {
  if (!text) return '';
  try { return marked.parse(text); } catch(e) { return esc(text); }
}

function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function scrollToBottom() {
  if (!document.getElementById('autoscrollCheck').checked) return;
  const el = document.getElementById('messages');
  el.scrollTop = el.scrollHeight;
}

function scheduleRender(conv) {
  if (_renderScheduled) return;
  _renderScheduled = true;
  requestAnimationFrame(() => {
    _renderScheduled = false;
    const c = conv || getActiveConv();
    if (c) {
      renderMessages(c);
      scrollToBottom();
    }
  });
}

function updateStreamingBubble(conv) {
  const el = document.getElementById('messages');
  const last = conv.messages[conv.messages.length - 1];
  if (!last || (last.type !== 'llm' && last.type !== 'thinking')) return false;
  const bubbles = el.querySelectorAll('.bubble-' + last.type);
  const lastBubble = bubbles[bubbles.length - 1];
  if (!lastBubble) return false;
  const contentEl = lastBubble.querySelector('.bubble-content');
  if (!contentEl) return false;
  contentEl.innerHTML = md(last.content);
  const briefEl = lastBubble.querySelector('.bubble-brief');
  if (briefEl) briefEl.textContent = briefText(last.content);
  return true;
}

function autoGrow(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 200) + 'px';
}

function onPromptKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendPrompt();
  }
}

async function sendPrompt() {
  const input = document.getElementById('promptInput');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  input.style.height = 'auto';

  let conv = getActiveConv();
  if (!conv) {
    await newConversation();
    conv = getActiveConv();
    if (!conv) return;
  }

  if (!conv.acp_session_id) {
    const initR = await fetch('/api/conversations/' + conv.id + '/init', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({prompt: text})
    });
    const data = await initR.json();
    if (data.error) { alert(data.error); return; }
    conv = data.conversation || conv;
    const idx = conversations.findIndex(c => c.id === conv.id);
    if (idx >= 0) conversations[idx] = conv;
    running = true;
    taskEntries = [];
    toolCallIdToName = {};
    renderTaskList();
    if (conv.agent) await loadToolDefs(conv.agent);
    renderMessages(conv);
    renderConvList();
    updateState(conv);
    return;
  }

  conv.messages.push({type:'user', content: text});
  conv.running = true;
  renderMessages(conv);
  running = true;
  taskEntries = [];
  toolCallIdToName = {};
  renderTaskList();
  renderConvList();
  updateState(conv);

  try {
    const r = await fetch('/api/conversations/' + conv.id + '/prompt', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({prompt: text})
    });
    const data = await r.json();
    if (data.conversation) {
      Object.assign(conv, data.conversation);
    }
  } catch(e) {
    conv.messages.push({type:'error', content: 'Fetch error: ' + e.message});
  }
  conv.running = false;
  running = false;
  renderMessages(conv);
  renderConvList();
  updateState(conv);
  scrollToBottom();
}

async function cancelSession() {
  const conv = getActiveConv();
  if (!conv) return;
  await fetch('/api/conversations/' + conv.id + '/cancel', {method:'POST'});
  conv.running = false;
  running = false;
  taskEntries = taskEntries.map(t => t.status === 'in_progress' ? {...t, status: 'completed'} : t);
  renderTaskList();
  renderConvList();
  updateState(conv);
}

function connectSSE() {
  const es = new EventSource('/api/events');
  es.onmessage = (e) => {
    const data = JSON.parse(e.data);
    handleEvent(data);
  };
  es.onerror = () => {
    setTimeout(connectSSE, 3000);
  };
}

function handleEvent(ev) {
  if (ev.event === 'conversation_created') {
    if (!conversations.find(c => c.id === ev.data?.id)) {
      conversations.unshift(ev.data);
      renderConvList();
    }
    return;
  }
  if (ev.event === 'conversation_deleted') {
    conversations = conversations.filter(c => c.id !== ev.data?.id);
    if (activeConvId === ev.data?.id) {
      activeConvId = conversations[0]?.id || null;
    }
    renderConvList();
    if (activeConvId) selectConversation(activeConvId);
    return;
  }
  if (ev.event === 'conversation_updated') {
    const idx = conversations.findIndex(c => c.id === ev.data?.id);
    if (idx >= 0) {
      const local = conversations[idx];
      const remote = ev.data;
      Object.assign(local, {
        title: remote.title,
        agent: remote.agent,
        system_prompt: remote.system_prompt,
        tools: remote.tools,
        token_stats: remote.token_stats,
        acp_session_id: remote.acp_session_id
      });
    }
    renderConvList();
    if (activeConvId === ev.data?.id) {
      scheduleRender(getActiveConv());
    }
    return;
  }

  const conv = conversations.find(c => c.id === ev.conversation_id);
  if (!conv) return;
  switch(ev.event) {
    case 'session_update':
      handleSessionUpdate(conv, ev.data);
      break;
    case 'ask_open_ended':
      handleAskOpenEnded(conv, ev);
      break;
    case 'ask_exec':
      handleAskExec(conv, ev);
      break;
    case 'ask_multiple_choice':
      handleAskMultipleChoice(conv, ev);
      break;
    case 'state':
      conv.running = ev.data?.running || false;
      running = conv.running;
      if (ev.data && !ev.data.running) {
        taskEntries = taskEntries.map(t => t.status === 'in_progress' ? {...t, status: 'completed'} : t);
        renderTaskList();
      }
      updateState(conv);
      renderConvList();
      break;
    case 'token_stats':
      if (ev.data) {
        if (!conv.token_stats) conv.token_stats = {prompt_tokens:0,completion_tokens:0,total_tokens:0,llm_calls:0};
        conv.token_stats.prompt_tokens += ev.data.prompt_tokens || 0;
        conv.token_stats.completion_tokens += ev.data.completion_tokens || 0;
        conv.token_stats.total_tokens += ev.data.total_tokens || 0;
        conv.token_stats.llm_calls += ev.data.llm_calls || 0;
        tokenStats = conv.token_stats;
        updateTokenPill();
      }
      break;
    case 'tool_request_update':
      if (ev.data && ev.data.toolCallId && ev.data.rawInput) {
        for (let i = conv.messages.length - 1; i >= 0; i--) {
          const m = conv.messages[i];
          if (m.type === 'tool_request') {
            try {
              const parsed = JSON.parse(m.content);
              const tcId = parsed.toolCallId || parsed.toolCallID || parsed.id;
              if (tcId === ev.data.toolCallId) {
                parsed.rawInput = JSON.parse(ev.data.rawInput);
                m.content = JSON.stringify(parsed);
                break;
              }
            } catch(e) {}
          }
        }
      }
      break;
  }
  if (conv.id === activeConvId) {
    scheduleRender(conv);
  }
}

function handleSessionUpdate(conv, bubble) {
  if (!bubble || !bubble.type) return;
  if (bubble.type === 'ask_open_ended' || bubble.type === 'ask_exec' || bubble.type === 'ask_multiple_choice') return;
  if (bubble.type === 'llm' || bubble.type === 'thinking') {
    const last = conv.messages[conv.messages.length - 1];
    if (last && last.type === bubble.type && last._merging) {
      last.content += bubble.content;
      if (conv.id === activeConvId && updateStreamingBubble(conv)) {
        if (!_streamUpdateScheduled) {
          _streamUpdateScheduled = true;
          requestAnimationFrame(() => {
            _streamUpdateScheduled = false;
            scrollToBottom();
          });
        }
        return;
      }
    } else {
      conv.messages.push({type: bubble.type, content: bubble.content, _merging: true, timestamp: bubble.timestamp});
    }
    if (conv.id === activeConvId) scheduleRender(conv);
    return;
  }
  if (bubble.type === 'tool_request') {
    conv.messages.push({type:'tool_request', name: bubble.name, content: bubble.content, timestamp: bubble.timestamp});
    try {
      const parsed = JSON.parse(bubble.content);
      const tcId = parsed.toolCallId || parsed.toolCallID || parsed.id;
      const tcName = parsed.title || parsed.name || bubble.name;
      if (tcId) toolCallIdToName[tcId] = tcName;
    } catch(e) {}
    return;
  }
  if (bubble.type === 'tool_response') {
    conv.messages.push({type:'tool_response', name: bubble.name, id: bubble.id, content: bubble.content, timestamp: bubble.timestamp});
    const lookupKey = bubble.id || bubble.name;
    const realToolName = toolCallIdToName[lookupKey] || bubble.name;
    updateTasksFromToolResponse(realToolName, bubble.content);
    return;
  }
  if (bubble.type === 'error') {
    conv.messages.push({type:'error', content: bubble.content, timestamp: bubble.timestamp});
    return;
  }
  conv.messages.push(bubble);
}

function updateTasksFromToolResponse(toolName, content) {
  const lines = content.split('\n').filter(l => l.trim());
  const parseLine = (line) => {
    const m = line.match(/^(\d+(?:\.\d+)*)\.\s*\[([ _Xx])\]\s*(.*)/);
    if (!m) return null;
    const statusChar = m[2];
    let status = 'pending';
    if (statusChar === '_') status = 'in_progress';
    if (statusChar === 'X' || statusChar === 'x') status = 'completed';
    return {id: m[1], content: m[3].trim(), status};
  };

  if (['task_create','task_set_status','task_delete'].includes(toolName)) {
    for (const line of lines) {
      const entry = parseLine(line);
      if (entry) {
        const existing = taskEntries.find(t => t.id === entry.id);
        if (existing) { existing.status = entry.status; existing.content = entry.content; }
        else taskEntries.push(entry);
      }
    }
  } else if (toolName === 'tasks_list') {
    const parsed = lines.map(parseLine).filter(Boolean);
    if (parsed.length > 0) taskEntries = parsed;
  } else if (toolName === 'tasks_clear') {
    taskEntries = [];
  }
  renderTaskList();
}

function renderTaskList() {
  const el = document.getElementById('taskItems');
  const container = document.getElementById('taskList');
  if (taskEntries.length === 0) {
    container.style.display = 'none';
    return;
  }
  container.style.display = '';
  const icons = {pending: '○', in_progress: '◐', completed: '●', failed: '✕'};
  el.innerHTML = taskEntries.map(t => {
    const icon = icons[t.status] || '○';
    return `<div class="task-item ${t.status} d-flex align-items-baseline gap-1 small" style="color:var(--cat-text2);padding:2px 0">
      <span class="task-icon flex-shrink-0" style="width:14px;text-align:center">${icon}</span>
      <span class="task-text flex-grow-1 overflow-hidden" style="text-overflow:ellipsis;white-space:nowrap" title="${esc(t.content)}">${esc(t.content)}</span>
    </div>`;
  }).join('');
}

function handleAskOpenEnded(conv, ev) {
  const msg = {type:'ask_open_ended', id: ev.data.ask_id, question: ev.data.question, answered: false, answer: ''};
  conv.messages.push(msg);
  if (conv.id === activeConvId) renderMessages(conv);
}

function renderAskOpenEnded(m) {
  if (m.answered) {
    return bubbleHTML('tool-resp', 'Your Answer', esc(m.answer), false, true, briefText(m.answer));
  }
  return `<div class="ask-panel" id="ask-${m.id}">
    <div class="ask-title">💬 Question</div>
    <p>${md(m.question)}</p>
    <textarea class="form-control form-control-sm mb-2" id="ask-input-${m.id}" rows="3" placeholder="Your answer…" style="background:var(--cat-bg);border-color:var(--cat-border);color:var(--cat-text)"></textarea>
    <div class="d-flex gap-2">
      <button class="btn btn-sm fw-semibold" style="background:var(--cat-green);color:var(--cat-bg);border-color:var(--cat-green)" onclick="answerAsk('${m.id}', document.getElementById('ask-input-${m.id}').value)">Submit</button>
    </div>
  </div>`;
}

function handleAskExec(conv, ev) {
  const msg = {
    type:'ask_exec', id: ev.data.ask_id,
    cmdline: ev.data.cmdline,
    timeout: ev.data.timeout || 30,
    answered: false, approved: false, answer: ''
  };
  conv.messages.push(msg);
  if (conv.id === activeConvId) renderMessages(conv);
}

function renderAskExec(m) {
  if (m.answered) {
    const status = m.approved ? '✅ Approved' : '❌ Denied';
    return bubbleHTML(m.approved ? 'tool-resp' : 'error', `ask_exec ${status}`, esc(m.approved ? m.cmdline : 'Denied: ' + m.answer), false, true, `${status}: ${esc(m.approved ? m.cmdline : m.answer)}`);
  }
  return `<div class="ask-panel" id="ask-${m.id}">
    <div class="ask-title">⚡ Execute Command</div>
    <label class="form-label small mb-1" style="color:var(--cat-text2)">Command:</label>
    <input class="form-control form-control-sm mb-2" id="ask-cmd-${m.id}" value="${esc(m.cmdline)}" style="background:var(--cat-bg);border-color:var(--cat-border);color:var(--cat-text)" />
    <label class="form-label small mb-1" style="color:var(--cat-text2)">Timeout (seconds):</label>
    <input class="form-control form-control-sm mb-2" type="number" id="ask-timeout-${m.id}" value="${m.timeout}" min="1" style="background:var(--cat-bg);border-color:var(--cat-border);color:var(--cat-text)" />
    <div class="d-flex gap-2">
      <button class="btn btn-sm fw-semibold" style="background:var(--cat-green);color:var(--cat-bg);border-color:var(--cat-green)" onclick="answerExec('${m.id}', true)">Approve</button>
      <button class="btn btn-sm btn-outline-danger" onclick="answerExec('${m.id}', false)">Deny</button>
    </div>
    <div class="mt-2 d-none" id="deny-row-${m.id}">
      <label class="form-label small mb-1" style="color:var(--cat-text2)">Reason for denial (optional):</label>
      <input class="form-control form-control-sm mb-1" id="ask-deny-${m.id}" placeholder="Explain to the agent…" style="background:var(--cat-bg);border-color:var(--cat-border);color:var(--cat-text)" />
      <button class="btn btn-sm btn-outline-danger" onclick="submitDeny('${m.id}')">Submit Deny</button>
    </div>
  </div>`;
}

function handleAskMultipleChoice(conv, ev) {
  const msg = {
    type:'ask_multiple_choice', id: ev.data.ask_id,
    question: ev.data.question,
    choices: ev.data.choices || [],
    allow_open_ended: ev.data.allow_open_ended || false,
    answered: false, answer: ''
  };
  conv.messages.push(msg);
  if (conv.id === activeConvId) renderMessages(conv);
}

function renderAskMultipleChoice(m) {
  if (m.answered) {
    return bubbleHTML('tool-resp', 'Your Choice', esc(m.answer), false, true, briefText(m.answer));
  }
  let choices = m.choices.map((c,i) =>
    `<button class="choice-btn" onclick="answerChoice('${m.id}', ${i}, this)">${esc(c)}</button>`
  ).join('');
  let openEnd = '';
  if (m.allow_open_ended) {
    openEnd = `<div class="mt-2 d-flex gap-2">
      <input class="form-control form-control-sm flex-grow-1" id="ask-custom-${m.id}" placeholder="Type your own response…" style="background:var(--cat-bg);border-color:var(--cat-border);color:var(--cat-text)" />
      <button class="choice-btn" onclick="answerCustom('${m.id}')">Submit</button>
    </div>`;
  }
  return `<div class="ask-panel" id="ask-${m.id}">
    <div class="ask-title">❓ Multiple Choice</div>
    <p>${md(m.question)}</p>
    <div>${choices}</div>
    ${openEnd}
  </div>`;
}

async function answerAsk(askId, answer) {
  await fetch('/api/ask/' + askId, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({type:'open_ended', answer})
  });
  markAskAnswered(askId, false, answer);
}

function answerExec(askId, approved) {
  if (approved) {
    const cmd = document.getElementById('ask-cmd-' + askId).value;
    const timeout = parseInt(document.getElementById('ask-timeout-' + askId).value) || 30;
    fetch('/api/ask/' + askId, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({type:'exec', approved:true, cmdline:cmd, timeout})
    });
    markAskAnswered(askId, true, cmd);
  } else {
    document.getElementById('deny-row-' + askId).classList.remove('d-none');
  }
}

function submitDeny(askId) {
  const reason = document.getElementById('ask-deny-' + askId).value;
  fetch('/api/ask/' + askId, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({type:'exec', approved:false, deny_reason: reason})
  });
  markAskAnswered(askId, false, reason);
}

function answerChoice(askId, idx, btn) {
  const conv = getActiveConv();
  const msg = conv?.messages?.find(m => m.id === askId);
  const choice = msg?.choices?.[idx] || '';
  fetch('/api/ask/' + askId, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({type:'multiple_choice', answer: choice})
  });
  markAskAnswered(askId, false, choice);
}

function answerCustom(askId) {
  const answer = document.getElementById('ask-custom-' + askId)?.value || '';
  if (!answer) return;
  fetch('/api/ask/' + askId, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({type:'multiple_choice', answer})
  });
  markAskAnswered(askId, false, answer);
}

function markAskAnswered(askId, approved, answer) {
  conversations.forEach(c => {
    const m = c.messages?.find(m => m.id === askId);
    if (m) {
      m.answered = true;
      m.approved = approved;
      m.answer = answer || '';
    }
  });
  const conv = getActiveConv();
  if (conv) renderMessages(conv);
}
